<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador VIP de Prêmios</title>
  <!-- Efeito Visual de Confetes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #121214; color: #fff; display: flex; justify-content: center; padding: 20px 10px; min-height: 100vh; }
    
    .app-container { width: 100%; max-width: 480px; background: #1e1e24; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    h1 { text-align: center; font-size: 1.5rem; color: #ffcc00; margin-bottom: 5px; }
    p.subtitle { text-align: center; font-size: 0.85rem; color: #aaa; margin-bottom: 20px; }

    /* QUADRADOS DAS CATEGORIAS */
    .grid-categories { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .card-cat { background: #2a2a35; border: 2px solid #3a3a4c; border-radius: 15px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .card-cat:active { transform: scale(0.95); }
    .card-cat.selected { border-color: #ffcc00; background: #343446; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
    .card-cat .icon { font-size: 2.2rem; }
    .card-cat .title { font-size: 0.95rem; font-weight: bold; }

    /* ÁREA DO SORTEIO */
    .draw-section { display: none; }
    .category-banner { background: #ffcc00; color: #000; text-align: center; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; }
    textarea { width: 100%; height: 130px; background: #121214; border: 2px solid #3a3a4c; border-radius: 12px; color: #fff; padding: 12px; font-size: 0.9rem; resize: none; outline: none; margin-bottom: 12px; }
    textarea:focus { border-color: #ffcc00; }
    
    .btn-draw { width: 100%; background: linear-gradient(135deg, #ffcc00, #ff8800); border: none; border-radius: 12px; padding: 16px; color: #000; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 136, 0, 0.4); }
    .btn-draw:active { transform: scale(0.98); }

    /* RESULTADO DO SORTEIO */
    .result-box { margin-top: 20px; background: #121214; border: 2px dashed #ffcc00; border-radius: 15px; padding: 20px; text-align: center; display: none; }
    .result-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .winner-id { font-size: 1.8rem; font-weight: 900; color: #ffcc00; margin: 10px 0; word-break: break-all; }
    .roulette-anim { font-size: 1.5rem; color: #00e676; font-weight: bold; animation: pulse 0.1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🎰 Painel de Sorteios VIP</h1>
    <p class="subtitle">Escolha a categoria do sorteio de hoje:</p>

    <!-- QUADRADOS DAS CATEGORIAS -->
    <div class="grid-categories">
      <div class="card-cat" onclick="selectCategory('Vale Pizza 🍕')"><span class="icon">🍕</span><span class="title">Vale Pizza</span></div>
      <div class="card-cat" onclick="selectCategory('Vale Açaí 🍧')"><span class="icon">🍧</span><span class="title">Vale Açaí</span></div>
      <div class="card-cat" onclick="selectCategory('Vale Pix 💸')"><span class="icon">💸</span><span class="title">Vale Pix</span></div>
      <div class="card-cat" onclick="selectCategory('Vale iFood 🍔')"><span class="icon">🍔</span><span class="title">Vale iFood</span></div>
      <div class="card-cat" onclick="selectCategory('Vale Almoço 🥗')"><span class="icon">🥗</span><span class="title">Vale Almoço</span></div>
      <div class="card-cat" onclick="selectCategory('Vale Sushi 🍣')"><span class="icon">🍣</span><span class="title">Vale Sushi</span></div>
      <div class="card-cat" style="grid-column: span 2;" onclick="selectCategory('Sorteio Comum 🎁')"><span class="icon">🎁</span><span class="title">Sorteio Comum</span></div>
    </div>

    <!-- ÁREA DE SORTEIO -->
    <div class="draw-section" id="drawSection">
      <div class="category-banner" id="bannerText">PRÊMIO SELECIONADO</div>
      <textarea id="idList" placeholder="Cole aqui a lista inteira de IDs do grupo...&#10;Exemplo:&#10;ID 94820&#10;ID 10293&#10;ID 48201"></textarea>
      <button class="btn-draw" onclick="startDraw()">SORTEAR AGORA 🎲</button>

      <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle">SORTEANDO...</div>
        <div class="winner-id" id="winnerDisplay">...</div>
      </div>
    </div>
  </div>

  <script>
    let currentCategory = "";

    function selectCategory(name) {
      currentCategory = name;
      document.querySelectorAll('.card-cat').forEach(c => c.classList.remove('selected'));
      event.currentTarget.classList.add('selected');

      document.getElementById('bannerText').innerText = `PRÊMIO: ${name}`;
      document.getElementById('drawSection').style.display = 'block';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('drawSection').scrollIntoView({ behavior: 'smooth' });
    }

    function startDraw() {
      const rawText = document.getElementById('idList').value.trim();
      if (!rawText) return alert("Por favor, cole a lista de IDs antes de sortear!");

      const ids = rawText.split('\n').map(id => id.trim()).filter(id => id.length > 0);
      if (ids.length === 0) return alert("Nenhum ID válido encontrado!");

      const resultBox = document.getElementById('resultBox');
      const winnerDisplay = document.getElementById('winnerDisplay');
      const resultTitle = document.getElementById('resultTitle');

      resultBox.style.display = 'block';
      resultTitle.innerText = "SORTEANDO GANHADOR...";
      winnerDisplay.classList.add('roulette-anim');

      let counter = 0, speed = 60, duration = 2500;
      const interval = setInterval(() => {
        winnerDisplay.innerText = ids[Math.floor(Math.random() * ids.length)];
        counter += speed;

        if (counter >= duration) {
          clearInterval(interval);
          const winner = ids[Math.floor(Math.random() * ids.length)];
          winnerDisplay.classList.remove('roulette-anim');
          resultTitle.innerText = `🎉 GANHADOR DO ${currentCategory.toUpperCase()}! 🎉`;
          winnerDisplay.innerText = winner;

          confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
        }
      }, speed);
    }
  </script>
</body>
</html>
